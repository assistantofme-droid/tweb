# 7eve9Chat web at /web-k/, reaching the 7eve9Chat backend through this server.
#
# The browser only ever talks to this server: /web-k/api, /web-k/uploads and
# /web-k/socket.io are passed on to the backend, so it needs no CORS for this
# domain. Build the app with VITE_SEVEN_NINE_ORIGIN=/web-k (the Dockerfile does).
#
# Already running nginx on the host? Copy the `map` into the http block and the
# `location`s (with the proxy settings) into your HTTPS server block, and point
# `root` at the folder that holds web-k/.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' '';
}

server {
  listen 80;
  server_name _;

  # photos, videos and files are uploaded through here
  client_max_body_size 2g;

  # ---- the backend, as seen from the browser: same origin as the app ----
  proxy_http_version 1.1;
  proxy_ssl_server_name on;
  proxy_set_header Host 7eve9craft.ir;
  # the backend sees its own site as the origin (CORS / Socket.IO origin checks)
  proxy_set_header Origin https://7eve9craft.ir;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  location /web-k/api/ {
    proxy_pass https://7eve9craft.ir/api/;
    proxy_request_buffering off;
  }

  location /web-k/uploads/ {
    proxy_pass https://7eve9craft.ir/uploads/;
  }

  location /web-k/socket.io/ {
    proxy_pass https://7eve9craft.ir/socket.io/;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # ---- the app ----
  location = /web-k {
    return 301 /web-k/;
  }

  location /web-k/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ =404;

    # file names carry a hash; these don't, so they are always revalidated
    location ~ (\/|index\.html|version)$ {
      add_header Cache-Control "no-cache";
    }

    location ~ \.webmanifest$ {
      default_type application/manifest+json;
      add_header Cache-Control "no-cache";
    }
  }
}
